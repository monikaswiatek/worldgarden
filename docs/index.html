    function getWeekNumber() {
      const currentDate = new Date();
      const startDate = new Date(currentDate.getFullYear(), 0, 1); // Pierwszy dzień roku
      const days = Math.floor((currentDate - startDate) / (1000 * 60 * 60 * 24));
      const weekNumber = Math.ceil((days + 1) / 7); // Numer tygodnia
      console.log("Current Week Number: ", weekNumber); // Logowanie numeru tygodnia
      return weekNumber;
    }

    function displayFlower() {
      const weekNumber = getWeekNumber(); // Pobierz numer tygodnia
      const flowerIndex = (weekNumber - 1) % plantsAndPoems.length; // Wylicz indeks na podstawie tygodnia

      flowerDiv.innerHTML = `
